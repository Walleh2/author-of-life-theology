<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - Author of Life Institute of Theology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy-dark: #031932; /* Matches your dashboard panel background */
            --gold-accent: #c28e34; /* Institutional gold */
            --bg-light: #f4f7f9;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--white);
            max-width: 420px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(3, 25, 50, 0.08);
            border: 1px solid #eef2f6;
            overflow: hidden;
        }

        .login-header {
            background-color: var(--navy-dark);
            color: var(--white);
            padding: 35px 25px;
            text-align: center;
        }

        .login-logo {
            font-size: 32px;
            color: var(--gold-accent);
            margin-bottom: 12px;
        }

        .login-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 11px;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-body {
            padding: 35px 30px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px rgba(194, 142, 52, 0.15);
        }

        .btn-login {
            width: 100%;
            background-color: var(--gold-accent);
            color: var(--white);
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #a67628;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .login-footer {
            text-align: center;
            padding: 0 30px 30px 30px;
        }

        .back-to-web {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-to-web:hover {
            color: var(--gold-accent);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2>Author of Life</h2>
            <p>Institute of Theology</p>
        </div>

        <div class="login-body">
            <div class="error-msg" id="login-error">Invalid Student ID or Password.</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">Unique Student ID</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="studentId" placeholder="e.g., AOLIT/26/089" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentPassword">Password / Pin</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="studentPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">Access Portal</button>
            </form>
        </div>

        <div class="login-footer">
            <a href="index.html" class="back-to-web">
                <i class="fa-solid fa-arrow-left-long"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studentIdInput = document.getElementById('studentId').value.trim();
            const passwordInput = document.getElementById('studentPassword').value;
            const errorDisplay = document.getElementById('login-error');

            // Hardcoded check for demo simulation (In production, replace with your backend API request)
            if (studentIdInput.toUpperCase() === "AOLIT/26/089" && passwordInput === "123456") {
                errorDisplay.style.display = "none";
                // Redirect straight into their custom dashboard panel
                window.location.href = "student-portal.html";
            } else {
                // Show validation feedback text
                errorDisplay.textContent = "Access Denied. Check ID or Password.";
                errorDisplay.style.display = "block";
            }
        });
    </script>
</body>
</html>
